# Sincroniza os textos de lei do pop-up (js/*-texto.js) com o texto oficial do Planalto, toda segunda-feira (ou manualmente).
# Roda nos servidores do GitHub (o ambiente das sessões do Claude não consegue abrir o Planalto).
# Só abre/mescla PR se algum artigo mudou de fato; falha de rede ou diferença suspeita não altera nada.
name: sync-textos-oficiais
on:
  schedule:
    - cron: '17 8 * * 1'     # segunda 05:17 (Brasília)
  workflow_dispatch:
    inputs:
      so_relatorio:
        description: 'Só relatório (não grava nada)'
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Sincronizar
        id: sync
        env: { SO_REL: "${{ github.event.inputs.so_relatorio }}" }
        run: |
          ARGS=""
          if [ "$SO_REL" = "true" ]; then ARGS="--so-relatorio"; fi
          python3 .claude/skills/atualizacao-legal-semanal/sync_textos.py $ARGS | tee relatorio.json
          echo "== resumo =="
          python3 - <<'PY'
          import json
          r = json.load(open('relatorio.json'))
          for x in r: print(x['norma'].ljust(18), x['status'], x.get('artigos_alterados', ''), x.get('erro', ''))
          PY
      - name: Abrir PR e mesclar (só se houve mudança)
        if: github.event.inputs.so_relatorio != 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git diff --quiet && { echo "Sem mudanças."; exit 0; }
          for f in $(git diff --name-only | grep '\.js$'); do node --check "$f"; done
          V=$(grep -o 'v[0-9]\{3\}' index.html | head -1); N=$((10#${V#v}+1)); NV="v$N"
          sed -i "s/$V/$NV/g" index.html
          B="claude/atualizacao-legal-$(date +%Y-%m-%d)-sync"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b "$B"; git add -A; git commit -m "Textos oficiais sincronizados com o Planalto ($NV)"
          git push origin "$B"
          gh pr create --base main --head "$B" --title "Textos oficiais sincronizados ($NV)" --body "Atualização automática de js/*-texto.js a partir do Planalto, com registro em ALTERACOES_LEGAIS. Gabaritos e listas não foram tocados."
          gh pr merge "$B" --squash --delete-branch
