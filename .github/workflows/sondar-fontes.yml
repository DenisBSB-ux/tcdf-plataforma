# Sondagem manual: quais fontes oficiais respondem a leitura automática (User-Agent honesto). Só imprime códigos HTTP.
name: sondar-fontes
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Sondar
        run: |
          UA='TCDF-Plataforma-sync/1.0 (estudo pessoal; leitura de textos oficiais)'
          for u in \
            https://www.planalto.gov.br/ccivil_03/leis/l9784.htm \
            https://www2.camara.leg.br/legin/fed/lei/1999/lei-9784-29-janeiro-1999-368445-norma-pl.html \
            https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:1999-01-29;9784 \
            https://legis.senado.leg.br/norma/551660 \
            https://dadosabertos.camara.leg.br/api/v2/proposicoes?siglaTipo=PL\&ano=2026\&itens=1 \
            https://legis.senado.leg.br/dadosabertos/legislacao/lista?tipo=LEI\&ano=2026 \
            https://www.in.gov.br/ \
            https://portal.stf.jus.br/ \
            https://www.tc.df.gov.br/ \
            https://www.sinj.df.gov.br/ ; do
            c=$(curl -sS -m 25 -A "$UA" -o /tmp/o.html -w '%{http_code} %{size_download}b' "$u" 2>&1 | tail -1)
            echo "$c  $u"
          done
