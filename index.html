async function pullFromCloud({silent} = {}){
  if(!FIREBASE_OK || !STATE.syncCode) return null;
  if(!silent) setSyncStatusDOM('pending', 'sincronizando…');
  try{
    const doc = await fbDb.collection('progresso').doc(STATE.syncCode).get();
    if(doc.exists){
      const data = doc.data();
      // retrocompatibilidade: documentos gravados antes da v42 podem ter
      // 'progress' direto no manifesto (objeto nativo ou string) — a partir da
      // v42, cada matéria tem seu próprio documento (ver pushToCloud)
      if(data.progress){
        const progressoAntigo = typeof data.progress === 'string' ? JSON.parse(data.progress) : data.progress;
        mergeRemoteProgressoNaMemoria(progressoAntigo);
      }
      const materiasComProgresso = Array.isArray(data.materiasComProgresso) ? data.materiasComProgresso : [];
      let algumaEdicaoNova = false;
      for(const materiaNome of materiasComProgresso){
        try{
          const docMateria = await fbDb.collection('progresso').doc(`${STATE.syncCode}__${slugify(materiaNome)}`).get();
          if(docMateria.exists && docMateria.data().progress){
            mergeRemoteProgressoNaMemoria({ [materiaNome]: JSON.parse(docMateria.data().progress) });
          }
          if(docMateria.exists && docMateria.data().edicoes){
            if(mergeRemoteEdicoesNaMemoria(JSON.parse(docMateria.data().edicoes))) algumaEdicaoNova = true;
          }
        }catch(e){ console.warn('Falha ao buscar o progresso da matéria "'+materiaNome+'" na nuvem', e); }
      }
      if(algumaEdicaoNova) salvarEdicoesUsuario();
      // matérias/questões em si não vêm mais daqui — elas já chegam via
      // carregarMateriasPublicas() (coleção publico/{materia}), evitando duplicar
      // o banco inteiro de questões dentro do documento pessoal de progresso
      if(data.quizzesEmAndamento){
        const quizzesRemotos = typeof data.quizzesEmAndamento === 'string' ? JSON.parse(data.quizzesEmAndamento) : data.quizzesEmAndamento;
        mergeRemoteQuizzesEmAndamentoNaMemoria(quizzesRemotos);
      }
      saveProgress();
      marcarUltimoSyncOk();
      return true;
    }else{
      // o código existe localmente, mas não tem NENHUM dado salvo na nuvem com esse
      // nome ainda — pode ser a primeira vez usando, ou pode ser um erro de digitação
      // (maiúscula/minúscula, espaço) fazendo cair num documento diferente do esperado
      setSyncStatusDOM('pending', `nenhum dado encontrado para "${STATE.syncCode}" — confira se digitou o código exatamente igual em todos os dispositivos`);
      return false;
    }
  }catch(e){
    console.error('Falha ao puxar da nuvem', e);
    setSyncStatusDOM('err', 'falha ao sincronizar (passe o mouse aqui)', motivoErroFirestore(e));
    return null;
  }
}

function sanitizarParaFirestore(obj){
  // remove chaves com valor undefined recursivamente (Firestore não aceita undefined)
  return JSON.parse(JSON.stringify(obj));
}

/* ================= matérias públicas (visíveis para todos os usuários) ================= */
// retorna true se conseguiu de fato consultar a nuvem (mesmo que não tenha
// encontrado nada) — false só em caso de falha real de rede/permissão, pra
// nunca confundir "nuvem vazia" com "nuvem inacessível" na reconciliação
async function carregarMateriasPublicas(){
  if(!FIREBASE_OK) return false;
  try{
    // cada matéria pública tem seu próprio documento (em vez de um documento gigante
    // compartilhado), pra nunca bater no limite de 1MB por documento do Firestore.
    // CORREÇÃO (v37): mesmo assim, uma matéria grande sozinha (ex.: 774 questões)
    // ultrapassa esse 1MB — agora ela pode estar dividida em vários documentos
    // "pedaço" com id "{slug}__p0", "{slug}__p1", etc, todos com o mesmo campo
    // .materia. O documento "{slug}" (sem sufixo) é o manifesto: guarda os metadados
    // e, pra matérias antigas/pequenas que nunca precisaram dividir, pode ainda
    // conter o array "questoes" completo direto nele (formato legado, ainda lido).
    const snapshot = await fbDb.collection('publico').get();
    const docs = snapshot.docs || [];

    // 1ª passada: descobre quais matérias (pelo slug BASE, sem sufixo de pedaço)
    // estão marcadas como removidas — precisa vir antes da 2ª passada porque a
    // ordem de leitura dos documentos do Firestore não é garantida, e um pedaço
    // não tem campo "removido" próprio (só o manifesto tem)
    docs.forEach(doc=>{
      const data = doc.data();
      if(!data || doc.id.startsWith('_')) return;
      if(data.removido){
        // registra tanto pelo campo do documento quanto pelo id do slug, já que
        // documentos antigos podem não ter o campo "materia" preenchido —
        // depender só dele já causou perda de dados por falso positivo (ver nota abaixo)
        if(data.materia) MATERIAS_REMOVIDAS_NUVEM.add(data.materia);
        SLUGS_REMOVIDOS_NUVEM.add(doc.id.replace(/__p\d+$/, ''));
      }
    });

    // 2ª passada: agrupa as questões de cada matéria (manifesto legado com array
    // embutido, e/ou pedaços) por nome, sem ainda tocar em ALL_QUESTIONS — só
    // troca o conteúdo local quando já tivermos o conjunto INTEIRO e válido
    // desta matéria em mãos, nunca aos poucos
    const questoesPorMateria = {};
    docs.forEach(doc=>{
      const data = doc.data();
      if(!data || doc.id.startsWith('_') || data.removido) return;
      const slugBase = doc.id.replace(/__p\d+$/, '');
      if(SLUGS_REMOVIDOS_NUVEM.has(slugBase)) return;
      if(Array.isArray(data.questoes) && data.questoes.length>0){
        data.questoes.forEach(q=>{
          if(!q || !q.uid || !q.materia) return;
          if(!questoesPorMateria[q.materia]) questoesPorMateria[q.materia] = [];
          questoesPorMateria[q.materia].push(q);
        });
      }
      // guarda o texto original e a versão do site que o processou pela última
      // vez — é o que permite reprocessar automaticamente sem reimportar na mão.
      // Só existe na nuvem pra matérias pequenas o bastante pra caber (ver
      // publicarQuestoesNoFirestore); pra matérias grandes, o texto original
      // ainda fica disponível localmente neste aparelho (TEXTOS_ORIGINAIS_KEY).
      if(data.textoOriginal && data.materia){
        TEXTOS_ORIGINAIS[data.materia] = { texto: data.textoOriginal, versaoProcessada: data.versaoProcessada || null };
      }
      if(data.materia && typeof data.atualizadoEm === 'number'){
        MATERIA_ATUALIZADOEM_NUVEM_VISTO[data.materia] = data.atualizadoEm;
      }
    });

    // CORREÇÃO CRÍTICA (v57): antes, só ADICIONAVA questões cujo uid ainda não
    // existia localmente — uma matéria já presente neste dispositivo (por ter
    // sido importada ou carregada aqui em algum momento) NUNCA era atualizada
    // com correções feitas depois em OUTRO dispositivo (deduplicação,
    // "Substituir tudo", edição de texto), porque o uid já existia e o merge
    // simplesmente pulava — resultado: "acessei com esse PC e estão
    // desatualizadas", relatado em produção. Agora, pra cada matéria cujo
    // conteúdo completo e válido veio da nuvem, o conteúdo local dela é
    // SUBSTITUÍDO por inteiro: a nuvem é sempre a fonte de verdade do
    // CONTEÚDO das questões, em qualquer dispositivo, a cada abertura da
    // página. origem:'importado' (e não 'publico') de propósito — assim esse
    // conteúdo fica salvo localmente (ver saveCustomQuestions) e continua
    // disponível mesmo se a nuvem ficar inacessível numa abertura futura,
    // sem deixar de ser atualizado sempre que a nuvem estiver acessível.
    // Isso nunca apaga uma matéria só por ela não aparecer nesta leitura —
    // só substitui quando já se tem o conteúdo novo em mãos pra pôr no lugar.
    let mudou = false;
    Object.entries(questoesPorMateria).forEach(([materiaNome, questoesNuvem])=>{
      ALL_QUESTIONS = ALL_QUESTIONS.filter(q => q.materia !== materiaNome);
      questoesNuvem.forEach(q=>{ ALL_QUESTIONS.push({ ...q, origem: 'importado' }); });
      mudou = true;
    });
    if(mudou){ reindex(); await saveCustomQuestions(); }
    return true;
  }catch(e){ console.warn('Falha ao carregar matérias públicas', e); return false; }
}

// grava uma matéria na coleção pública do Firestore. CORREÇÃO (v37): antes, cada
// matéria virava UM documento só — funcionava até o limite de 1MB do Firestore,
// mas uma matéria grande (ex.: 774 questões, ~1,2MB em JSON) sozinha já estoura
// esse teto. Agora a matéria é dividida em documentos "pedaço" por tamanho em
// bytes (não por quantidade de questões, já que o tamanho varia muito questão a
// questão), com um documento "manifesto" separado (sem o array de questões)
// guardando só metadados + quantos pedaços existem. Sem mexer em STATE.importLog
// nem chamar render() — usada tanto pelos botões manuais quanto pela publicação
// automática após importar.
const LIMITE_BYTES_POR_CHUNK = 700000; // margem de segurança abaixo do limite de campo indexado do Firestore (~1.048.487 bytes)
function tamanhoUtf8(str){
  return new TextEncoder().encode(str).length;
}
async function publicarQuestoesNoFirestore(nomesMaterias, force){
  if(!FIREBASE_OK) return { ok:false, motivo:'Sincronização em nuvem indisponível nesta sessão.' };
  if(!nomesMaterias || nomesMaterias.length===0) return { ok:false, motivo:'Nenhuma matéria selecionada.' };
  // cada matéria é publicada de forma INDEPENDENTE — se uma falhar, as demais
  // continuam sendo processadas normalmente, e o retorno indica exatamente quais
  // falharam, em vez de abortar o lote inteiro silenciosamente na primeira
  // matéria problemática
  let totalNovas = 0;
  const falhas = [];
  for(const materiaNome of nomesMaterias){
    try{
      const slug = slugify(materiaNome);
      const manifestRef = fbDb.collection('publico').doc(slug);
      const manifestDoc = await comLimiteDeTempo(manifestRef.get(), 15000, 'tempo esgotado ao consultar manifesto de "'+materiaNome+'"');
      // TRAVA DE SEGURANÇA: uma matéria marcada como removida é um "túmulo" —
      // só uma reimportação EXPLÍCITA do usuário (force=true) pode trazê-la de
      // volta. Sem essa trava, qualquer chamada automática/em segundo plano
      // que ainda tivesse a matéria em ALL_QUESTIONS local (armazenamento
      // desatualizado, outra aba, reprocessamento) a ressuscitava sem querer.
      if(manifestDoc.exists && manifestDoc.data().removido===true && !force){
        console.warn(`Matéria "${materiaNome}" está marcada como removida — publicação ignorada (use reimportação explícita para trazê-la de volta)`);
        continue;
      }

      // recolhe as questões já publicadas — só usado pra saber quantos pedaços
      // existiam antes (pra limpar os que sobrarem, se a matéria encolheu)
      const manifestData = manifestDoc.exists ? manifestDoc.data() : null;
      const numChunksAntigo = (manifestData && manifestData.numChunks) || 0;

      // (item 5) se a nuvem tem um atualizadoEm mais novo do que o último que
      // ESTE dispositivo viu (registrado em carregarMateriasPublicas), outro
      // dispositivo/aba publicou algo aqui nesse meio tempo — sobrescrever
      // agora descartaria esse trabalho sem aviso nenhum. Não bloqueia (quem
      // chamou publicarQuestoesNoFirestore já tomou uma decisão deliberada),
      // mas fica registrado como um alerta visível, não só um log escondido.
      if(manifestData && typeof manifestData.atualizadoEm === 'number'){
        const ultimoVisto = MATERIA_ATUALIZADOEM_NUVEM_VISTO[materiaNome];
        if(ultimoVisto && manifestData.atualizadoEm > ultimoVisto){
          const detalhe = `"${materiaNome}" foi atualizada na nuvem (${formatarDataHoraSalvamento(manifestData.atualizadoEm)}) por outro dispositivo/aba depois da última vez que este aparelho sincronizou — publicar agora vai sobrescrever essa versão mais nova.`;
          console.warn(detalhe);
          ALERTAS_SOBRESCRITA_NUVEM.push({ materia: materiaNome, ts: Date.now(), detalhe });
        }
      }

      // CORREÇÃO CRÍTICA (v43, unificada na v58): o array local (ALL_QUESTIONS)
      // é SEMPRE tratado como a versão correta e completa a publicar — nunca
      // mesclado com o que já estava na nuvem antes, com ou sem force. Isso já
      // valia pra force=true desde a v43 (ver histórico abaixo); até a v57,
      // sem force (reprocessamento automático em segundo plano) ainda mesclava
      // com o snapshot antigo da nuvem "por segurança" — mas isso podia
      // reintroduzir silenciosamente conteúdo obsoleto/duplicado que o
      // reprocessamento LOCAL acabara de corrigir, exatamente a mesma classe
      // de bug já corrigida pra force=true. Essa mescla deixou de ser
      // necessária a partir da v57: carregarMateriasPublicas() já sincroniza o
      // local com a nuvem mais recente ANTES do reprocessamento rodar (mesma
      // sequência de boot), então a essa altura o local já reflete a nuvem —
      // mesclar de novo só arriscava trazer de volta dado velho.
      // (histórico v43: force=true existe porque esta função é chamada por uma
      // ação EXPLÍCITA e deliberada do usuário — reimportar, inclusive
      // "🔁 Substituir tudo", salvar manualmente, ou renomear — e mesclar aqui
      // desfazia silenciosamente qualquer "Substituir tudo": o merge por uid
      // trazia de volta questões antigas/duplicadas dos pedaços velhos da
      // nuvem, cujos uids não colidiam com os novos, recém-gerados sem sufixo,
      // fazendo a AFO voltar a dobrar de tamanho no próximo carregamento —
      // bug real de produção.)
      const questoesAtuais = ALL_QUESTIONS.filter(q=>q.materia===materiaNome).map(q=>({ ...q, origem:'publico' }));
      totalNovas += questoesAtuais.length;

      // divide em pedaços por tamanho em bytes (acumula questões até chegar perto
      // do limite, então começa um pedaço novo)
      const chunks = [];
      let chunkAtual = [];
      let tamanhoAtual = 0;
      questoesAtuais.forEach(q=>{
        const tamanhoQ = tamanhoUtf8(JSON.stringify(q));
        if(chunkAtual.length>0 && tamanhoAtual + tamanhoQ > LIMITE_BYTES_POR_CHUNK){
          chunks.push(chunkAtual);
          chunkAtual = [];
          tamanhoAtual = 0;
        }
        chunkAtual.push(q);
        tamanhoAtual += tamanhoQ;
      });
      if(chunkAtual.length>0 || chunks.length===0) chunks.push(chunkAtual); // matéria vazia ainda precisa de um manifesto válido

      // texto original: só vai pra nuvem se couber com folga (matérias pequenas).
      // Matérias grandes perdem o reprocessamento automático em OUTROS
      // dispositivos, mas o texto continua disponível neste aparelho (salvo
      // localmente à parte, sem limite de tamanho — ver TEXTOS_ORIGINAIS_KEY)
      const textoOriginalAtual = TEXTOS_ORIGINAIS[materiaNome] ? (TEXTOS_ORIGINAIS[materiaNome].texto || TEXTOS_ORIGINAIS[materiaNome]) : (manifestData ? manifestData.textoOriginal : undefined);
      const cabeTextoOriginal = textoOriginalAtual && tamanhoUtf8(textoOriginalAtual) < LIMITE_BYTES_POR_CHUNK;

      const manifestPayload = sanitizarParaFirestore({
        materia: materiaNome,
        atualizadoEm: Date.now(),
        numChunks: chunks.length,
        versaoProcessada: (window.__TCDF_BUILD__ && window.__TCDF_BUILD__.versao) || null,
        ...(cabeTextoOriginal ? { textoOriginal: textoOriginalAtual } : {}),
      });
      // sobrescreve o documento inteiro (.set sem merge) — isso também remove
      // de propósito qualquer "removido:true" ou array "questoes" legado de
      // versões anteriores, já que uma reimportação explícita (force=true) deve
      // mesmo substituir esse estado
      await comLimiteDeTempo(manifestRef.set(manifestPayload), 15000, 'tempo esgotado ao publicar manifesto de "'+materiaNome+'"');
      MATERIA_ATUALIZADOEM_NUVEM_VISTO[materiaNome] = manifestPayload.atualizadoEm;

      for(let i=0;i<chunks.length;i++){
        await comLimiteDeTempo(fbDb.collection('publico').doc(`${slug}__p${i}`).set(sanitizarParaFirestore({
          materia: materiaNome,
          chunkIndex: i,
          questoes: chunks[i],
        })), 15000, 'tempo esgotado ao publicar pedaço '+i+' de "'+materiaNome+'"');
      }
      // se a matéria encolheu (menos pedaços que antes), limpa os pedaços que
      // sobraram — best-effort: se falhar, o pior caso é um pedaço órfão com
      // questões que já existem em uid duplicado em outro pedaço (não causa
      // perda de dado, só desperdiça um pouco de espaço na nuvem)
      for(let i=chunks.length;i<numChunksAntigo;i++){
        try{ await comLimiteDeTempo(fbDb.collection('publico').doc(`${slug}__p${i}`).delete(), 15000, 'tempo esgotado ao limpar pedaço órfão'); }catch(e){ /* best-effort */ }
      }

      STATE.materiasPublicadasNestaSessao.add(materiaNome);
    }catch(e){
      console.error('Falha ao publicar a matéria "'+materiaNome+'"', e);
      falhas.push({ materia: materiaNome, motivo: e && e.message ? e.message : motivoErroFirestore(e) });
    }
  }
  if(falhas.length===0) return { ok:true, totalNovas };
  if(falhas.length===nomesMaterias.length) return { ok:false, motivo: falhas.map(f=>`${f.materia}: ${f.motivo}`).join(' · ') };
  // sucesso parcial: publicou algumas, outras falharam — reporta os dois lados
  return { ok:true, parcial:true, totalNovas, falhas };
}


async function pushToCloud(){
  if(!FIREBASE_OK || !STATE.syncCode) return;
  // CORREÇÃO DEFINITIVA DE COTA (v49): nada a sincronizar — nenhuma chamada à
  // nuvem é feita. Antes, esta função reescrevia TODAS as matérias a cada
  // chamada (inclusive as 60 chamadas/hora do timer de fundo, mesmo sem
  // nenhuma resposta nova), o que sozinho já se aproximava do limite diário
  // gratuito do Firestore.
  if(MATERIAS_PROGRESSO_SUJAS.size===0) return;
  try{
    // CORREÇÃO CRÍTICA (v42): 'progress' de TODAS as matérias somadas numa
    // única string já passa de 1MB na escala real de uso (muitas matérias,
    // cada uma com centenas de questões respondidas e histórico) — o mesmo
    // limite de tamanho de documento do Firestore já resolvido antes pra
    // publico/{slug}. Agora cada matéria grava o próprio progresso no seu
    // próprio documento (como string JSON — 1 entrada de índice só, resolvendo
    // também o erro real de produção "too many index entries"), e o documento
    // principal só guarda a LISTA de quais matérias têm progresso salvo, pra
    // saber quais documentos buscar na leitura.
    // CORREÇÃO (v48): cada escrita agora tem limite de 15s e falhas de uma
    // matéria não impedem as outras de serem salvas — antes, com o Firestore
    // em backoff (cota excedida), a PRIMEIRA chamada travada já bloqueava o
    // laço inteiro (e essa função é chamada a cada resposta E ao remover
    // matéria), deixando ações simples como "Remover" parecendo travadas.
    // CORREÇÃO (v49): só percorre as matérias marcadas como "sujas"
    // (registrarResposta/registrarFlash/registrarSessao/etc. marcam a matéria
    // correspondente) — as outras 19 matérias que não mudaram não são
    // reescritas de novo. Cada matéria só sai da lista de "sujas" se a escrita
    // dela funcionar; se falhar, continua marcada e é tentada de novo na
    // próxima chamada.
    const materiasSujas = Array.from(MATERIAS_PROGRESSO_SUJAS);
    let algumaFalhou = false;
    for(const materiaNome of materiasSujas){
      const slugM = slugify(materiaNome);
      try{
        // edições manuais (enunciado/resolução/resumo flash) desta matéria —
        // vão junto no mesmo documento de progresso, pra sincronizar entre
        // dispositivos e sobreviver a uma limpeza de armazenamento local
        const edicoesDestaMateria = {};
        Object.keys(EDICOES_USUARIO).forEach(uid=>{
          const q = BY_UID[uid];
          if(q && q.materia===materiaNome) edicoesDestaMateria[uid] = EDICOES_USUARIO[uid];
        });
        await comLimiteDeTempo(fbDb.collection('progresso').doc(`${STATE.syncCode}__${slugM}`).set(sanitizarParaFirestore({
          materia: materiaNome,
          progress: JSON.stringify(PROGRESS[materiaNome]),
          edicoes: JSON.stringify(edicoesDestaMateria),
          updatedAt: Date.now(),
        })), 15000, 'tempo esgotado ao salvar progresso da matéria "'+materiaNome+'"');
        MATERIAS_PROGRESSO_SUJAS.delete(materiaNome);
      }catch(e){
        algumaFalhou = true;
        console.warn('Falha ao salvar progresso de uma matéria na nuvem — as demais continuam sendo tentadas', e);
      }
    }
    // merge:true é essencial aqui: sem isso, cada vez que o progresso é salvo
    // (a cada resposta) o documento inteiro seria sobrescrito, apagando o campo
    // quizzesEmAndamento gravado separadamente por sincronizarQuizEmAndamentoNaNuvem
    await comLimiteDeTempo(fbDb.collection('progresso').doc(STATE.syncCode).set(sanitizarParaFirestore({
      materiasComProgresso: Object.keys(PROGRESS),
      updatedAt: Date.now(),
    }), { merge: true }), 15000, 'tempo esgotado ao salvar o manifesto de progresso');
    if(algumaFalhou) throw new Error('uma ou mais matérias não sincronizaram (ver avisos acima) — os dados já estão salvos neste dispositivo');
    marcarUltimoSyncOk();
  }catch(e){
    console.error('Falha ao enviar para a nuvem', e);
    setSyncStatusDOM('err', 'falha ao sincronizar (passe o mouse aqui)', motivoErroFirestore(e));
  }
}

async function conectarSincronizacao(codigo){
  codigo = (codigo||'').trim().toLowerCase();
  if(!codigo) return;
  STATE.syncCode = codigo;
  try{ await storageSet(SYNC_CODE_KEY, codigo); }catch(e){ /* ignora */ }
  const encontrouDados = await pullFromCloud();
  // força um envio completo na conexão inicial — depois disso, só o que
  // realmente mudar é reenviado (ver marcarProgressoSujo)
  Object.keys(PROGRESS).forEach(m => marcarProgressoSujo(m));
  await pushToCloud();
  if(encontrouDados === false){
    // evita que a mensagem de sucesso do push (que roda logo em seguida, criando o
    // documento pela primeira vez) esconda o aviso importante de que não havia
    // NENHUM dado prévio salvo com esse código — sinal de possível erro de digitação
    setSyncStatusDOM('pending', `código "${STATE.syncCode}" conectado — é a primeira vez que ele é usado, sem dados prévios na nuvem`);
  }
  render();
}

function desconectarSincronizacao(){
  STATE.syncCode = '';
  STATE.syncStatus = null;
  storageSet(SYNC_CODE_KEY, '').catch(()=>{});
  render();
}

async function loadProgress(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.perguntas && !Object.values(parsed).some(v=>v && v.perguntas)){
        PROGRESS = { [MATERIA_PADRAO]: parsed };
      } else {
        PROGRESS = parsed || {};
      }
    }
  }catch(e){ /* chave ainda não existe */ }

  try{
    const res2 = await storageGet(CUSTOM_KEY);
    if(res2 && res2.value){
      const custom = JSON.parse(res2.value);
      if(Array.isArray(custom) && custom.length){
        const uids = new Set(ALL_QUESTIONS.map(q=>q.uid));
        custom.forEach(q=>{
          if(!q || !q.uid || uids.has(q.uid)) return;
          const fixed = {
            ...q,
            es: (q.es==='literal'||q.es==='tematico'||q.es==='fora') ? q.es : 'literal',
            nv: (q.nv==='baixa'||q.nv==='media'||q.nv==='alta') ? q.nv : 'media',
            t: (q.t==='CE'||q.t==='MC') ? q.t : 'sem_gabarito',
            materia: q.materia || 'Importado',
            tema: q.tema || 'Geral',
          };
          ALL_QUESTIONS.push(fixed);
          uids.add(q.uid);
        });
        reindex();
      }
    }
  }catch(e){ /* sem questões importadas ainda */ }

  try{
    const res3 = await storageGet(SYNC_CODE_KEY);
    if(res3 && res3.value) STATE.syncCode = res3.value.trim().toLowerCase();
  }catch(e){ /* sem código de sincronização configurado ainda */ }

  try{
    const res4 = await storageGet(ZOOM_KEY);
    if(res4 && res4.value){
      const z = parseFloat(res4.value);
      if(!isNaN(z) && z>=0.8 && z<=1.6) STATE.zoomLevel = z;
    }
  }catch(e){ /* usa o padrão de 100% */ }

  try{
    const res5 = await storageGet(THEME_KEY);
    if(res5 && res5.value==='light') STATE.theme = 'light';
  }catch(e){ /* usa o padrão escuro */ }
  aplicarTema();

  try{
    const resCor = await storageGet(CORTEMA_KEY);
    if(resCor && resCor.value) STATE.corTema = resCor.value;
  }catch(e){ /* usa a paleta padrão */ }
  aplicarCorTema();

  try{
    const resEd = await storageGet(EDICOES_KEY);
    if(resEd && resEd.value) EDICOES_USUARIO = JSON.parse(resEd.value);
  }catch(e){ /* nenhuma edição manual salva ainda */ }

  try{
    const resGab = await storageGet(GABARITOS_ALTERADOS_KEY);
    if(resGab && resGab.value) GABARITOS_ALTERADOS = JSON.parse(resGab.value);
  }catch(e){ /* nenhum gabarito alterado salvo ainda */ }

  try{
    const resTx = await storageGet(TEXTOS_ORIGINAIS_KEY);
    if(resTx && resTx.value) TEXTOS_ORIGINAIS = JSON.parse(resTx.value) || {};
  }catch(e){ /* nenhum texto original salvo localmente ainda */ }

  try{
    const resUa = await storageGet(MATERIA_ULTIMA_ATUALIZACAO_KEY);
    if(resUa && resUa.value) MATERIA_ULTIMA_ATUALIZACAO = JSON.parse(resUa.value) || {};
  }catch(e){ /* nenhuma data de atualização salva localmente ainda */ }

  try{
    const resOc = await storageGet(MATERIAS_OCULTAS_KEY);
    if(resOc && resOc.value) MATERIAS_OCULTAS = new Set(JSON.parse(resOc.value));
  }catch(e){ /* nenhuma matéria nativa removida ainda, neste aparelho */ }
  // também confere a lista compartilhada na nuvem, pra uma matéria removida
  // permanentemente num aparelho ficar removida em qualquer outro também
  if(FIREBASE_OK){
    try{
      const docOc = await fbDb.collection('publico').doc('_materias_ocultas').get();
      const nomesNaNuvem = (docOc.exists && Array.isArray(docOc.data().nomes)) ? docOc.data().nomes : [];
      nomesNaNuvem.forEach(n=>MATERIAS_OCULTAS.add(n));
      // AUTOCURA: se este aparelho tem na lista local algum nome que a nuvem
      // ainda não tem (ex.: uma tentativa de remoção anterior que salvou local
      // mas falhou ao gravar na nuvem por erro de permissão já corrigido),
      // empurra a lista completa pra nuvem agora, sem precisar de novo clique
      // em "Remover" — resolve o caso de "sumiu aqui, mas voltou no celular"
      const faltamNaNuvem = Array.from(MATERIAS_OCULTAS).some(n => !nomesNaNuvem.includes(n));
      if(faltamNaNuvem){
        try{ await fbDb.collection('publico').doc('_materias_ocultas').set({ nomes: Array.from(MATERIAS_OCULTAS) }); }
        catch(e){ console.error('Autocura da lista de matérias ocultas falhou', e); }
      }
    }catch(e){ /* segue só com a lista local, se a nuvem estiver indisponível */ }
  }
  if(MATERIAS_OCULTAS.size>0){
    ALL_QUESTIONS = ALL_QUESTIONS.filter(q => !(q.origem==='embutido' && MATERIAS_OCULTAS.has(q.materia)));
    reindex();
  }

  if(STATE.syncCode){
    try{
      const res6 = await storageGet(LAST_SYNC_KEY);
      if(res6 && res6.value){
        STATE.syncStatus = { type:'ok', msg: formatarUltimoSync(parseInt(res6.value,10)) };
      }
    }catch(e){ /* nunca sincronizou ainda neste dispositivo */ }
    // CORREÇÃO CRÍTICA (v46): erro real de produção — com a cota diária do
    // Firestore excedida, o SDK entra em "backoff máximo" e uma chamada como
    // esta pode ficar tentando de novo por muito tempo sem nunca resolver. Como
    // essa chamada era aguardada (await) ANTES do primeiro render(), a página
    // inteira ficava presa em "Carregando processo…" — não é a rede que estava
    // lenta, é a inicialização que nunca deveria ter dependido da nuvem pra
    // mostrar a interface. Um limite de 8s garante que, na pior das hipóteses, a
    // página sempre abre com os dados locais; o que vier da nuvem depois só
    // enriquece, nunca bloqueia.
    try{ await comLimiteDeTempo(pullFromCloud({ silent: true }), 8000, 'tempo esgotado ao sincronizar progresso'); }
    catch(e){ console.warn('Sincronização de progresso não respondeu a tempo — seguindo com os dados locais.', e); }
    // rede de segurança (v49): MATERIAS_PROGRESSO_SUJAS só existe em memória —
    // se um envio anterior falhou (ex.: cota excedida) e a página foi recarregada
    // antes de tentar de novo, aquela matéria ficaria sem sincronizar pra sempre.
    // Marcar tudo como pendente uma vez aqui (só na abertura da página, não a
    // cada resposta/minuto) garante consistência eventual sem voltar ao consumo
    // excessivo de cota que motivou a correção.
    Object.keys(PROGRESS).forEach(m => marcarProgressoSujo(m));
  }

  // matérias públicas (publicadas pelo administrador) aparecem para TODOS os usuários,
  // conectados ou não a um código de sincronização pessoal
  await sincronizarMateriasPublicas();
}

// CORREÇÃO (pedido do usuário): esse bloco só rodava UMA VEZ, na abertura da
// página — se outro dispositivo publicasse uma matéria nova ou questões
// adicionais enquanto esta aba já estava aberta, elas nunca apareciam aqui
// sem um reload completo da página. Extraído em função própria pra poder
// rodar de novo periodicamente (ver setInterval no init), além da chamada
// original na abertura. É seguro repetir: carregarMateriasPublicas() só
// ADICIONA uids que ainda não existem localmente, e a reconciliação de
// remoção só age sobre um sinal explícito (removido:true), nunca por
// ausência — rodar de novo não é mais arriscado que a chamada original.
async function sincronizarMateriasPublicas(){
  // CORREÇÃO (v73): nunca lê/substitui o local enquanto alguma escrita local
  // estiver em andamento (ver TRAVAS_ESCRITA_ATIVAS acima) — essa é a proteção
  // central contra a corrida entre os dois setInterval de 5 minutos.
  if(TRAVAS_ESCRITA_ATIVAS>0) return false;
  let nuvemDisponivel = false;
  try{
    nuvemDisponivel = await comLimiteDeTempo(carregarMateriasPublicas(), 8000, 'tempo esgotado ao carregar matérias públicas');
  }catch(e){
    console.warn('Carregamento de matérias públicas não respondeu a tempo — seguindo com os dados locais.', e);
  }
  // POLÍTICA DE SEGURANÇA (revista após perda real de dados causada pela
  // versão anterior desta função): NUNCA apagar uma matéria local só por
  // "não encontrei confirmação de que ela é válida na nuvem". Esse tipo de
  // checagem por ausência é frágil demais — qualquer inconsistência na leitura
  // (campo faltando num doc antigo, timing, paginação) vira perda de dado real,
  // como já aconteceu duas vezes. A partir de agora, uma matéria só é removida
  // por um sinal EXPLÍCITO e positivo de que o usuário pediu a remoção
  // (documento marcado removido:true, escrito pelo próprio botão "Remover").
  // Nunca por dedução de ausência.
  if(nuvemDisponivel){
    const antesDoFiltro = ALL_QUESTIONS.length;
    ALL_QUESTIONS = ALL_QUESTIONS.filter(q => {
      const slug = slugify(q.materia||'');
      if(MATERIAS_REMOVIDAS_NUVEM.has(q.materia) || SLUGS_REMOVIDOS_NUVEM.has(slug)) return false;
      return true;
    });
    if(ALL_QUESTIONS.length !== antesDoFiltro){
      reindex();
      await saveCustomQuestions();
    }
  }
  try{ await comLimiteDeTempo(reprocessarMateriasDesatualizadas(), 8000, 'tempo esgotado ao reprocessar matérias'); }
  catch(e){ console.warn('Reprocessamento automático não respondeu a tempo — tenta de novo na próxima abertura.', e); }
  try{ await comLimiteDeTempo(verificarTodosQuizzesSalvos(), 8000, 'tempo esgotado ao verificar simulados em andamento'); }
  catch(e){ console.warn('Verificação de simulados em andamento não respondeu a tempo — algumas matérias podem não mostrar "Continuar" até você entrar nelas.', e); }
}

/* ================= exportar / importar progresso (backup manual entre computadores) ================= */
function exportarProgresso(){
  const payload = {
    formato: 'sim-progresso-backup-v1',
    exportadoEm: new Date().toISOString(),
    progress: PROGRESS,
    questoesImportadas: ALL_QUESTIONS.filter(q => q.origem === 'importado'),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `progresso-simulado-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function importarProgresso(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload || typeof payload.progress !== 'object'){
        STATE.importProgressoLog = { error: 'Arquivo não reconhecido como backup de progresso válido.' };
        render();
        return;
      }
      // mescla progresso usando a mesma lógica robusta da sincronização em nuvem
      // (soma tentativas por questão sem perder nada do que já existe aqui)
      mergeRemoteProgressoNaMemoria(payload.progress);

      // reimporta também as questões customizadas do backup, se houver, evitando duplicar uid
      mergeRemoteQuestoesNaMemoria(payload.questoesImportadas);

      saveProgress();
      await saveCustomQuestions();
      STATE.importProgressoLog = { ok: true, ts: Date.now() };
      render();
    }catch(err){
      STATE.importProgressoLog = { error: 'Erro ao interpretar o arquivo: ' + err.message };
      render();
    }
  };
  reader.onerror = () => {
    STATE.importProgressoLog = { error: 'Não foi possível ler o arquivo selecionado.' };
    render();
  };
  reader.readAsText(file, 'utf-8');
}

function registrarResposta(materiaKey, uid, acertou){
  const bucket = getBucket(materiaKey);
  const p = bucket.perguntas[uid] || { tentativas:0, acertos:0, ultimoResultado:null, historico:[] };
  p.tentativas += 1;
  if(acertou) p.acertos += 1;
  p.ultimoResultado = acertou;
  p.historico.push({ ts: Date.now(), c: acertou });
  if(p.historico.length > 20) p.historico = p.historico.slice(-20);
  bucket.perguntas[uid] = p;
  marcarProgressoSujo(materiaKey);
  saveProgress();
}

function undoRegistro(materiaKey, uid){
  const bucket = getBucket(materiaKey);
  const p = bucket.perguntas[uid];
  if(!p || !p.tentativas) return;
  // CORREÇÃO: o histórico por tentativa é truncado em 20 entradas (por
  // espaço), mas p.tentativas nunca é truncado — numa questão respondida/
  // resetada mais de 20 vezes (ou após um merge de duplicatas que soma
  // tentativas sem garantir histórico equivalente), o histórico podia
  // esgotar antes das tentativas chegarem a zero. O código antigo dependia
  // 100% do histórico e simplesmente não fazia nada nesse caso — "Limpar
  // resposta" parecia não ter efeito nenhum na estatística. Sem histórico
  // detalhado pra essa tentativa, usa a única informação que ainda temos
  // (o ultimoResultado atual) como a tentativa sendo desfeita.
  if(p.historico && p.historico.length){
    const last = p.historico.pop();
    p.tentativas = Math.max(0, p.tentativas-1);
    if(last.c) p.acertos = Math.max(0, p.acertos-1);
    p.ultimoResultado = p.historico.length ? p.historico[p.historico.length-1].c : null;
  } else {
    p.tentativas = Math.max(0, p.tentativas-1);
    if(p.ultimoResultado===true) p.acertos = Math.max(0, p.acertos-1);
    p.ultimoResultado = null;
  }
  if(p.tentativas===0){ delete bucket.perguntas[uid]; } else { bucket.perguntas[uid] = p; }
  marcarProgressoSujo(materiaKey);
  saveProgress();
}

function registrarFlash(materiaKey, uid, status){
  getBucket(materiaKey).flash[uid] = { status, ts: Date.now() };
  marcarProgressoSujo(materiaKey);
  saveProgress();
}

function registrarSessao(materiaKey, total, acertos, tema, queue, respostas){
  const bucket = getBucket(materiaKey);
  // guarda queue/respostas (além de total/acertos) pra dar pra reabrir o simulado
  // depois a partir do histórico "Últimos simulados", não só dos salvos manualmente
  bucket.sessoes.push({ ts: Date.now(), total, acertos, tema: tema || 'todos', queue: queue||null, respostas: respostas||null });
  if(bucket.sessoes.length > 50) bucket.sessoes = bucket.sessoes.slice(-50);
  marcarProgressoSujo(materiaKey);
  saveProgress();
}

function resetProgressoMateria(materiaKey){
  PROGRESS[materiaKey] = { perguntas:{}, flash:{}, sessoes:[] };
  marcarProgressoSujo(materiaKey);
  saveProgress();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function esc(str){
  // remove marcadores de citação tipo "[cite: 4]" ou "[cite: 4, 7]" que vêm do
  // material de origem — não fazem sentido pro usuário final da plataforma
  str = (str||'').replace(/\s*\[cite:\s*\d+(?:\s*,\s*\d+)*\]/gi, '');
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// confirma que existe uma sequência real de algarismos romanos (I...II ou II...III)
// antes de tratar qualquer "I"/"V"/"X" isolado como item de lista — sem essa
// checagem, palavras/iniciais comuns do texto poderiam ser quebradas por engano
function temListaRomana(texto){
  return /\bI\b[\s\S]{0,400}?\bII\b/.test(texto) || /\bII\b[\s\S]{0,400}?\bIII\b/.test(texto);
}
function quebrarItensRomanos(texto){
  if(!texto || !temListaRomana(texto)) return texto;
  // aceita tanto "I O princípio" (espaço direto) quanto "I. Configura-se" (com
  // ponto logo após o algarismo) — formatos diferentes de origem usam um ou outro
  return texto.replace(/\s*\b(I|II|III|IV|V|VI|VII|VIII|IX|X)\b(\.?)(?=\s+\w)/g, '\n$1$2');
}

// separa a frase de contexto/introdução (ex.: "Com base na LODF, julgue o
// próximo item.") da assertiva/item propriamente dita, colocando cada uma em
// um parágrafo visualmente distinto — sem isso as duas ficam grudadas num
// bloco só de texto corrido
function separarContextoDoItem(texto){
  if(!texto) return texto;
  // acha a frase de contexto completa (ex.: "julgue os itens seguintes, conforme
  // a Lei Maria da Penha.") e quebra só depois dela terminar de verdade — em vez
  // de quebrar logo após "julgue...item(ns)", que falhava quando havia uma
  // cláusula extra no meio (", conforme a Lei X") antes do ponto final real
  const m = texto.match(/julgue\s+(?:o\s+(?:próximo\s+)?item|a\s+assertiva|os\s+itens?)\b[\s\S]{0,80}?[.!?:]\s+/i);
  if(!m) return texto;
  const fim = m.index + m[0].length;
  return texto.slice(0, fim).trimEnd() + '\n\n' + texto.slice(fim);
}

function limparEnunciado(texto, tipo){
  if(!texto) return '';
  let out = texto
    .replace(/\n?\s*\(\s*\)\s*(Certo|Errado)?\s*$/gim, '')
    .replace(/(\n\s*\(\s*\)\s*)+$/g, '')
    .replace(/\s*(Certo\s+Errado|Errado\s+Certo)\s*$/i, '') // remove "Certo Errado" solto no fim, sem parênteses
    .replace(/^\d+[.)]\s*/, ''); // remove numeração inicial, ex.: "13) " ou "18. "
  // ordem importa: quebra os itens romanos primeiro; se separarContextoDoItem
  // rodasse antes, a quebra dupla de parágrafo que ele insere seria engolida
  // pelo \s* da regex de itens romanos (que colapsa qualquer espaço/quebra
  // anterior a "I"/"II"/etc. em uma quebra simples só)
  out = quebrarItensRomanos(out);
  out = separarContextoDoItem(out);
  if(tipo==='MC'){
    // remove a listagem de alternativas (a) ... b) ... c) ...) do corpo do enunciado —
    // ela já aparece separadamente, como botões clicáveis, logo abaixo; sem isso a
    // mesma informação apareceria duas vezes na tela
    const semAlternativas = out
      .replace(/\n\s*a\)\s[\s\S]*$/i, '')
      .replace(/\s(?=[a-e]\)\s)[\s\S]*$/i, '')
      .trimEnd();
    // só aplica a limpeza se ainda sobrar um enunciado com conteúdo de verdade —
    // evita deixar a caixa em branco quando a extração "come" o texto todo
    if(semAlternativas.length >= 10) out = semAlternativas;
  }
  return out.trimEnd();
}

const STOPWORDS_PT = new Set(['a','o','as','os','de','da','do','das','dos','e','ou','que','se','em','no','na','nos','nas','um','uma','uns','umas','ao','aos','à','às','para','por','com','sem','sob','sobre','entre','até','desde','como','mais','menos','muito','pouco','já','não','sim','ser','são','é','foi','ter','tem','têm','seu','sua','seus','suas','este','esta','isto','esse','essa','isso','aquele','aquela','aquilo','ele','ela','eles','elas','nós','vós','lhe','lhes','me','te','também','apenas','só','pelo','pela','pelos','pelas','deve','devem','pode','podem','assim','cujo','cuja']);

function extrairPalavrasSignificativas(texto){
  if(!texto) return [];
  const palavras = texto
    .toLowerCase()
    .replace(/[.,;:()"'“”]/g,' ')
    .split(/\s+/)
    .filter(w=>w.length>=5 && !STOPWORDS_PT.has(w));
  return Array.from(new Set(palavras)).slice(0,8);
}

// palavras-chave da resposta correta: pra múltipla escolha, vem do texto da
// alternativa certa; pra Certo/Errado não existe "alternativa" com texto próprio,
// então usamos os termos determinantes do próprio enunciado (é a assertiva que
// está sendo julgada certa ou errada)
function palavrasChaveDaRespostaCorreta(q){
  if(q.t==='MC'){
    const g = gabaritoEfetivo(q);
    if(!q.alt || !g) return [];
    const correta = q.alt.find(a=>a.letra.toUpperCase()===g.toUpperCase());
    if(!correta || !correta.texto) return [];
    return extrairPalavrasSignificativas(correta.texto);
  }
  if(q.t==='CE'){
    return extrairPalavrasSignificativas(q.q || '');
  }
  return [];
}

// termos decisivos clássicos de banca (CEBRASPE em especial): palavras restritivas
// ou absolutas que costumam ser o ponto de virada de uma assertiva Certo/Errado.
// Estilo visual PRÓPRIO (sublinhado + cor), diferente do negrito de gabarito,
// pra não confundir as duas fontes de destaque.
const TERMOS_DECISIVOS = [
  'exclusivamente','unicamente','tão somente','tão-somente','somente','apenas',
  'sempre','nunca','jamais','todo','toda','todos','todas','nenhum','nenhuma',
  'absolutamente','obrigatoriamente','necessariamente','impreterivelmente',
  'incondicionalmente','indistintamente','invariavelmente','qualquer',
  'em qualquer hipótese','sob nenhuma hipótese','de forma alguma','sim','não',
];
// recebe HTML JÁ ESCAPADO (esc(texto)) e injeta o sublinhado sem tocar o que
// já é tag — mesmo cuidado usado em destacarPalavrasChave, pra combinar as duas
function destacarTermosDecisivos(htmlEscapado){
  if(!htmlEscapado) return '';
  let html = htmlEscapado;
  const ordenados = [...TERMOS_DECISIVOS].sort((a,b)=>b.length-a.length);
  ordenados.forEach(termo=>{
    const escapado = termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g,'\\s+');
    const re = new RegExp(`\\b(${escapado})\\b`, 'gi');
    html = html.replace(re, (m, offset) => /<[^>]*$/.test(html.slice(0, offset)) ? m : `<u class="kw-decisivo">${m}</u>`);
  });
  return html;
}
function destacarPalavrasChave(texto, palavrasExtras){
  if(!texto) return '';
  let html = destacarTermosDecisivos(esc(texto));
  // negrito só nas palavras-chave extraídas estritamente da resposta correta —
  // nada de padrão genérico (referência legal, conector modal etc.) que não vem
  // diretamente do gabarito da questão
  if(palavrasExtras && palavrasExtras.length){
    const ordenadas = [...palavrasExtras].sort((a,b)=>b.length-a.length);
    ordenadas.forEach(palavra=>{
      const escapada = palavra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escapada}\\w*)\\b`, 'gi');
      html = html.replace(re, (m, offset) => /<[^>]*$/.test(html.slice(0, offset)) ? m : `<strong class="kw-gabarito">${m}</strong>`);
    });
  }
  return html;
}

// quebra um texto corrido em frases (nova sentença = novo parágrafo), evitando
// quebrar em abreviações jurídicas comuns (art., §, nº, inc., etc.) ou em siglas
function dividirEmFrases(texto){
  if(!texto) return [];
  const marcado = texto.replace(
    /\b(art|arts|inc|par|§|nº|n°|no|ed|op|cit|cf|vs|sr|sra|dr|dra|min|des|ex)\.\s/gi,
    m => m.replace('.', '\u0000')
  );
  const partes = marcado
    .split(/(?<=[.!?])\s+(?=[A-ZÀ-Ú"“(])|\n+/)
    .map(p => p.replace(/\u0000/g, '.').trim())
    .filter(Boolean);
  return partes.length ? partes : [texto.trim()];
}

// confirma que existe uma lista alfabética real (pelo menos "a)" e "b)") antes de
// tratar qualquer letra solta como item de lista — evita falso positivo em
// referências avulsas como "art. 5º, a)"
function temListaAlfabetica(texto){
  return /\ba\)/i.test(texto) && /\bb\)/i.test(texto);
}
// quebra de linha antes de cada item alfabético (a) b) c)...), inclusive o caso
// "c. e d)" (quando duas letras são combinadas numa análise só)
function quebrarItensAlfabeticos(texto){
  if(!texto || !temListaAlfabetica(texto)) return texto;
  return texto.replace(/\s*\b([a-e])(\)|\.\s*e\s*[a-e]\))/gi, '\n$1$2');
}

// combina a quebra em frases (item 5) com o destaque de palavras-chave (item 6):
// cada frase vira um parágrafo próprio, já com os termos relevantes marcados
function formatarTextoComDestaque(texto, palavrasExtras){
  if(!texto) return '';
  const comQuebras = quebrarItensAlfabeticos(texto);
  const frases = dividirEmFrases(comQuebras);
  return frases.map(f => `<p>${destacarPalavrasChave(f, palavrasExtras)}</p>`).join('');
}

// extrai banca/cargo de q.bc, aceitando três formatos:
// 1) clássico "BANCA, cargo (órgão)" — usado no material embutido e no parser padrão
// 2) "BANCA - cargo_abrev (ÓRGÃO)/ÓRGÃO/formação/ano" — visto em matérias como a
//    AFO. PRECISA ser checado ANTES dos outros dois formatos, por dois motivos
//    encontrados na prática: (a) a lista de formação do cargo às vezes tem
//    vírgulas no meio (ex.: "Administração, Economia ou Direito"), o que fazia o
//    formato clássico (que corta na PRIMEIRA vírgula do texto inteiro) cortar no
//    lugar errado e virar uma "banca" gigante e sem sentido; (b) sem esse
//    formato dedicado, o formato alternativo abaixo pegava a SIGLA DO ÓRGÃO
//    (ex.: "ANM", "UDESC") como se fosse banca, descartando a banca real
//    (ex.: "CEBRASPE (CESPE)") — que nem aparecia como opção de filtro.
// 3) alternativo "cargo abrev (órgão)/ÓRGÃO/área/cargo completo/ano" — visto em
//    matérias importadas cujo texto de origem não usa vírgula nem " - "; nesse
//    caso o campo logo após a primeira barra costuma ser a sigla do órgão/concurso,
//    que é o que dá pra usar como "banca" pra fins de filtro
function extrairBancaECargo(bc){
  if(!bc) return { banca:'—', cargo:'' };
  const txt = String(bc).trim();

  const mHifen = txt.match(/^([^,\/]+?)\s+-\s+(.+\/.+)$/);
  if(mHifen){
    const banca = mHifen[1].trim() || '—';
    const partes = mHifen[2].trim().split('/').map(p=>p.trim()).filter(Boolean);
    const semAno = (partes.length>1 && /^\d{4}$/.test(partes[partes.length-1])) ? partes.slice(0,-1) : partes.slice();
    const cargo = semAno.join(' — ');
    return { banca, cargo };
  }
  if(txt.indexOf(',') !== -1){
    const idx = txt.indexOf(',');
    return { banca: txt.slice(0, idx).trim() || '—', cargo: txt.slice(idx+1).trim() };
  }
  if(txt.indexOf('/') !== -1){
    const partes = txt.split('/').map(p=>p.trim()).filter(Boolean);
    const semAno = (partes.length>1 && /^\d{4}$/.test(partes[partes.length-1])) ? partes.slice(0,-1) : partes.slice();
    if(semAno.length===0) return { banca:'—', cargo:'' };
    const banca = semAno[1] || semAno[0] || '—';
    const cargo = semAno.length>2 ? semAno.slice(2).join(' — ') : (semAno[0] || '');
    return { banca, cargo };
  }
  return { banca: txt, cargo: '' };
}
function bancaCurta(bc){
  return extrairBancaECargo(bc).banca;
}
function cargoCurto(bc){
  return extrairBancaECargo(bc).cargo;
}
function tendenciaCurta(td){
  if(!td) return 'estável';
  if(td.indexOf('↑')!==-1) return 'crescente';
  if(td.indexOf('↓')!==-1) return 'decrescente';
  return 'estável';
}
function anosDisponiveis(){

  scoreableFiltradas().forEach(q=>{ if(!isInedita(q)) set.add(bancaCurta(q.bc)); });

}
function cargosDisponiveis(){

}

function questoesFiltradas(){
  if(!STATE.materia) return [];
  return ALL_QUESTIONS.filter(q => q.materia===STATE.materia && (STATE.tema==='todos' || q.tema===STATE.tema) && !q.duplicataOculta);
}
// mesmo escopo de questoesFiltradas(), mas incluindo de volta qualquer questão
// que o usuário já tenha respondido alguma vez — mesmo que ela tenha sido
// marcada como duplicata depois. Usado só pra estatísticas/caderno de erros,
// pra não sumir com histórico de quem respondeu antes dessa checagem existir
function scopeUidsComHistorico(){
  if(!STATE.materia) return new Set();
  const bucket = getBucket(STATE.materia);
  const base = new Set(questoesFiltradas().map(q=>q.uid));
  Object.keys(bucket.perguntas).forEach(uid=>{
    const q = BY_UID[uid];
    if(q && q.materia===STATE.materia && (STATE.tema==='todos' || q.tema===STATE.tema)) base.add(uid);
  });
  return base;
}
function scoreableFiltradas(){
  return questoesFiltradas().filter(q => q.t==='CE' || q.t==='MC');
}

// CORREÇÃO: "certas/erradas" antes somava TODAS as tentativas históricas
// (p.tentativas/p.acertos) — uma questão errada uma vez e depois corrigida
// numa tentativa posterior continuava contando como "errada" pra sempre
// nesse total, mesmo já tendo desaparecido do Caderno de erros (que sempre
// olha só o ÚLTIMO resultado, via p.ultimoResultado). Isso fazia "Erradas"
// no cabeçalho nunca bater com a quantidade real no Caderno de erros — o
// usuário via, por ex., "10 erradas" no topo e o Caderno de erros vazio.
// Agora os dois usam exatamente a mesma definição (resultado atual por
// questão), então "Erradas" aqui sempre é igual a getCadernoErros().length.
function computeSnapshot(){
  if(!STATE.materia) return { respondidas:0, tent:0, ac:0, taxa:0, erros:0, totalPontuavel:0 };
  const bucket = getBucket(STATE.materia);
  const scopeUids = scopeUidsComHistorico();
  const nums = Object.keys(bucket.perguntas).filter(u=>scopeUids.has(u));
  let ac=0, erradas=0;
  nums.forEach(u=>{
    const r = bucket.perguntas[u].ultimoResultado;
    if(r===true) ac++;
    else if(r===false) erradas++;
  });
  const tent = ac + erradas;
  return { respondidas: nums.length, tent, ac, taxa: pct(ac,tent), erros: erradas, totalPontuavel: scoreableFiltradas().length };
}

// mesma métrica de computeSnapshot, mas pra QUALQUER matéria (não só a atualmente
// selecionada) e sem filtro de assunto — usada pra mostrar "% geral | certo |
// errado | total" ao lado do nome de cada disciplina no menu
// CORREÇÃO: contava QUALQUER registro em bucket.perguntas, mesmo de uma
// questão que não existe mais em ALL_QUESTIONS (órfã — sobra de um reimport,
// dedup ou remoção anterior que apagou a questão mas não o registro de
// progresso dela). O computeSnapshot() do topo da página já ignorava órfãs;
// esta função não, e por isso as duas nunca batiam (ex.: tabela mostrando
// mais "respondidas" que o cabeçalho, pra mesma matéria).
// agrupa TODAS as respostas já dadas nesta matéria por dia (data local do
// navegador), calculando a taxa de acerto de cada dia — base pro gráfico de
// tendência em linha. Cada questão carrega seu próprio histórico (até 20
// tentativas mais recentes, ver registrarResposta), então isto varre todas as
// questões da matéria e junta os eventos numa única linha do tempo.
function computeTendenciaDiariaMateria(materiaKey){
  const bucket = getBucket(materiaKey);
  const porDia = {}; // { 'AAAA-MM-DD': {acertos, total} }
  Object.entries(bucket.perguntas).forEach(([uid,p])=>{
    if(!BY_UID[uid] || !p.historico) return;
    p.historico.forEach(ev=>{
      if(!ev || !ev.ts) return;
      const d = new Date(ev.ts);
      const chave = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(!porDia[chave]) porDia[chave] = { acertos:0, total:0, ts: new Date(chave).getTime() };
      porDia[chave].total++;
      if(ev.c) porDia[chave].acertos++;
    });
  });
  return Object.entries(porDia)
    .map(([dia, v]) => ({ dia, ts: v.ts, total: v.total, pct: pct(v.acertos, v.total) }))
    .sort((a,b)=> a.ts - b.ts);
}

// desenha um gráfico de linha simples em SVG inline (sem depender de nenhuma
// biblioteca externa — mantém o arquivo autocontido) a partir dos pontos
// {ts, pct} de computeTendenciaDiariaMateria
function renderGraficoTendenciaSVG(pontos, corLinha){
  const largura = 220, altura = 60, margem = 6;
  if(pontos.length===0){
    return `<div style="height:${altura}px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);">sem respostas registradas ainda</div>`;
  }
  if(pontos.length===1){
    return `<div style="height:${altura}px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);">só um dia com resposta (${pontos[0].pct}%) — sem tendência ainda</div>`;
  }
  const minTs = pontos[0].ts, maxTs = pontos[pontos.length-1].ts;
  const rangeTs = Math.max(1, maxTs-minTs);
  const coords = pontos.map(p=>{
    const x = margem + ((p.ts-minTs)/rangeTs) * (largura-2*margem);
    const y = margem + (1 - p.pct/100) * (altura-2*margem);
    return { x, y, p };
  });
  const linha = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const pontosSvg = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.3" fill="${corLinha}"><title>${esc(c.p.dia)}: ${c.p.pct}% (${c.p.total} resposta${c.p.total>1?'s':''})</title></circle>`).join('');
  return `<svg viewBox="0 0 ${largura} ${altura}" width="100%" height="${altura}" preserveAspectRatio="none" style="display:block;overflow:visible;">
    <line x1="${margem}" y1="${margem}" x2="${largura-margem}" y2="${margem}" stroke="currentColor" stroke-opacity=".08" />
    <line x1="${margem}" y1="${altura-margem}" x2="${largura-margem}" y2="${altura-margem}" stroke="currentColor" stroke-opacity=".08" />
    <polyline points="${linha}" fill="none" stroke="${corLinha}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
    ${pontosSvg}
  </svg>`;
}

function computeSnapshotMateria(materiaKey){
  const bucket = getBucket(materiaKey);
  let ac=0, erradas=0, ultimaRespostaTs=null;
  Object.entries(bucket.perguntas).forEach(([uid,p])=>{
    if(!BY_UID[uid]) return; // órfã: questão não existe mais na base atual
    if(p.ultimoResultado===true) ac++;
    else if(p.ultimoResultado===false) erradas++;
    // (item 3) última resposta dada nesta matéria — o último item do histórico
    // de cada questão tem o timestamp mais recente PRA AQUELA questão; pega o
    // maior entre todas as questões da matéria
    if(p.historico && p.historico.length>0){
      const tsDaQuestao = p.historico[p.historico.length-1].ts;
      if(tsDaQuestao && (!ultimaRespostaTs || tsDaQuestao>ultimaRespostaTs)) ultimaRespostaTs = tsDaQuestao;
    }
  });
  const totalPontuavel = ALL_QUESTIONS.filter(q=>q.materia===materiaKey && !q.duplicataOculta && (q.t==='CE'||q.t==='MC')).length;
  return { taxa: pct(ac, ac+erradas), ac, erradas, totalPontuavel, ultimaRespostaTs };
}

function trendTag(td){
  if(!td) return '';
  let cls = 'tag-estavel';
  if(td.indexOf('↑')!==-1) cls='tag-crescente';
  else if(td.indexOf('↓')!==-1) cls='tag-decrescente';
  return `<span class="tag ${cls}" title="Tendência histórica na banca">${esc(td)}</span>`;
}
function trendBadge(td){
  if(!td) return '';
  let cls = 'estavel';
  if(td.indexOf('↑')!==-1) cls='crescente';
  else if(td.indexOf('↓')!==-1) cls='decrescente';
  return `<span class="trend-badge ${cls}" title="Tendência histórica na banca">${esc(td)}</span>`;
}
const NIVEL_SETA = { baixa:'↓', media:'→', alta:'↑' };
function nivelBadge(nv){
  const seta = NIVEL_SETA[nv];
  if(!seta) return '';
  return `<span class="nivel-badge ${nv}" title="Nível de incidência: ${esc(NIVEL_LABEL[nv]||'')}">${seta} ${esc(NIVEL_LABEL[nv]||'')}</span>`;
}
function freqBadge(fr){
  if(!fr) return '';
  return `<span class="freq-badge" title="Frequência histórica por banca e ano">📊 ${esc(fr)}</span>`;
}
function probabilidadeBadge(pp){
  if(!pp) return '';
  return `<span class="prob-badge" title="Probabilidade preditiva de recorrência">🎯 ${esc(pp)}</span>`;
}
// combina nível de incidência + tendência num único veredito direto, pra quem
// não tem "Probabilidade Preditiva" explícita na fonte (caso das listas que só
// trazem incidência histórica em concursos, sem esse campo pronto)
const MATRIZ_PROBABILIDADE = {
  alta:  { crescente:'Alta', 'estável':'Alta',   decrescente:'Média' },
  media: { crescente:'Alta', 'estável':'Média',  decrescente:'Baixa' },
  baixa: { crescente:'Média','estável':'Baixa',  decrescente:'Baixa' },
};
function probabilidadeCalculada(q){
  if(q.pp) return null; // já existe um valor explícito da fonte, não sobrepor
  const narrativa = narrativaBanca(q);
  // CORREÇÃO (v54): antes, se narrativaBanca não tivesse veredito, caía de
  // volta na MATRIZ_PROBABILIDADE (q.nv/q.td) — os mesmos campos fabricados
  // por questão que causam o bug relatado ("Assunto novo, Alta
  // probabilidade" numa questão de Interpretação de Textos). Removido: sem
  // dado real suficiente (poucas provas na base), o correto é não afirmar
  // nada, não inventar uma probabilidade com base num palpite por questão.
  return (narrativa && narrativa.forcaProbabilidade) || null;
}
function probabilidadeCalculadaBadge(q){
  const p = probabilidadeCalculada(q);
  if(!p) return '';
  const cor = p==='Alta' ? 'prob-alta' : p==='Média' ? 'prob-media' : 'prob-baixa';
  return `<span class="prob-badge prob-calc ${cor}" title="Estimativa combinando nível de incidência histórica e tendência recente — não é um campo direto da fonte">🎯 ${p} probabilidade</span>`;
}

// CORREÇÃO (v54): a versão antiga lia q.fr — o texto "📊 Incidência
// histórica: N concursos distintos..." que o Gemini FABRICA por questão no
// momento da geração, sem de fato contar provas. Pra Português (e qualquer
// matéria com texto-base único por questão), isso é sempre ~1, fazendo toda
// questão parecer "assunto novo" com probabilidade forçada Alta — o bug
// relatado. A versão nova usa analisarTemasDaMateria, que conta PROVAS REAIS
// DISTINTAS (valores únicos de q.bc) na base inteira daquela matéria, não um
// palpite por questão. "Como a banca pensa" agora reflete o que de fato está
// importado, e avisa explicitamente quando a amostra ainda é pequena, em vez
// de travestir "poucos dados" de "assunto novo e quente".
function narrativaBanca(q){
  if(isInedita(q)) return null;
  if(!q.tema || !q.materia) return null;
  const analise = analisarTemasDaMateriaCached(q.materia);
  const dados = analise.find(a => a.tema===q.tema);
  if(!dados) return null;

  const { faixa, confianca, tendenciaTxt, nProvasComTema, totalProvas, provasRecentesComTema, totalProvasRecentes, score } = dados;

  if(confianca==='baixa'){
    return { icone:'❔', cor:'narr-raro', titulo:'Poucos dados ainda',
      texto:`Só ${totalProvas} prova${totalProvas===1?'':'s'} ${totalProvas===1?'real':'reais'} dessa matéria na base até agora — ainda não dá pra estimar com confiança a probabilidade deste assunto. Isso não quer dizer que ele é raro na banca, só que a base ainda é pequena.`,
      forcaProbabilidade: null };
  }

  const detalheRecente = totalProvasRecentes>0 ? ` Nos últimos 5 anos: ${provasRecentesComTema} de ${totalProvasRecentes} provas.` : '';
  if(faixa==='alta'){
    return { icone:'🔥', cor:'narr-alta', titulo:'Alta probabilidade',
      texto:`Apareceu em ${nProvasComTema} das ${totalProvas} provas reais já vistas dessa matéria (${Math.round(score*100)}%). Tendência: ${tendenciaTxt}.${detalheRecente}`,
      forcaProbabilidade:'Alta' };
  }
  if(faixa==='media'){
    return { icone:'⚖️', cor:'narr-estavel', titulo:'Média probabilidade',
      texto:`Apareceu em ${nProvasComTema} das ${totalProvas} provas reais já vistas dessa matéria (${Math.round(score*100)}%). Tendência: ${tendenciaTxt}.${detalheRecente}`,
      forcaProbabilidade:'Média' };
  }
  return { icone:'🎲', cor:'narr-raro', titulo:'Baixa probabilidade',
    texto:`Apareceu em só ${nProvasComTema} das ${totalProvas} provas reais já vistas dessa matéria (${Math.round(score*100)}%). Tendência: ${tendenciaTxt}.${detalheRecente}`,
    forcaProbabilidade:'Baixa' };
}
function narrativaBancaBanner(q){
  const n = narrativaBanca(q);
  if(!n) return '';
  // a probabilidade calculada entra dentro da própria narrativa (em vez de um
  // badge separado logo acima) — evita repetir o mesmo veredito duas vezes
  // com cores parecidas, já que a narrativa por si só já entrega o "porquê"
  const prob = n.forcaProbabilidade || probabilidadeCalculada(q);
  const probTxt = (prob && !q.pp) ? ` <span class="narr-prob">(${esc(prob)} probabilidade)</span>` : '';
  return `<div class="narr-banner ${n.cor}">
    <span class="narr-icone">${n.icone}</span>
    <span class="narr-texto"><b>${esc(n.titulo)}</b>${probTxt} — ${esc(n.texto)}</span>
  </div>`;
}
function freqHistLine(fr){
  if(!fr) return '';
  return `<div class="freq-hist"><span class="lbl-inline">Frequência por ano:</span> ${esc(fr)}</div>`;
}
function bancaCargoAnoLine(q){
  const banca = bancaCurta(q.bc);
  const ano = q.ar || (q.an && q.an.length ? Math.max(...q.an) : null);
  // remove um ano já embutido no fim do texto do cargo (ex.: "Agente
  // Administrativo — 2025") pra não duplicar com o campo "Ano:" logo depois
  let cargo = cargoCurto(q.bc);
  if(cargo && ano) cargo = cargo.replace(new RegExp(`[\\s\\u2014-]*${ano}\\s*$`), '').trim();
  return `<span class="lbl-inline">Banca:</span> ${esc(banca)}`
    + (cargo ? ` &nbsp;·&nbsp; <span class="lbl-inline">Cargo:</span> ${esc(cargo)}` : '')
    + (ano ? ` &nbsp;·&nbsp; <span class="lbl-inline">Ano:</span> ${ano}` : '');
}
// padrão banca-cargo-ano-incidência: a incidência histórica entra aqui em forma
// compacta de símbolo (📊 total ×, 🕐 recentes nos últimos 5 anos), em vez do
// texto completo — que continua disponível por extenso no badge/tooltip
function incidenciaSimbolo(q){
  if(!q.fr || isInedita(q)) return '';
  const mTotal = q.fr.match(/(\d+)\s*concursos?\s*distint/i);
  if(!mTotal) return '';
  const mRecentes = q.fr.match(/\((\d+)\s*nos? [úu]ltimos\s*5\s*anos\)/i);
  const total = mTotal[1];
  const recentes = mRecentes ? mRecentes[1] : null;
  return ` &nbsp;·&nbsp; <span class="lbl-inline" title="${esc(q.fr)}">📊 ${total}×${recentes!==null ? `&nbsp;<span style="opacity:.7;">(🕐${recentes} recentes)</span>` : ''}</span>`;
}

// ano mais recente entre todas as questões da matéria atual, usado como referência
// para decidir o que conta como "últimos dois anos" nos dados daquela matéria
function anoMaisRecente(materiaKey){
  let max = 0;
  ALL_QUESTIONS.forEach(q=>{ if((!materiaKey || q.materia===materiaKey) && q.ar && q.ar>max) max=q.ar; });
  return max;
}
function tendenciaQuente(q){
  if(!q.td || q.td.indexOf('↑')===-1 || !q.ar) return false;
  const maxAno = anoMaisRecente(q.materia);
  return maxAno>0 && q.ar >= maxAno-1;
}
function alertaTendenciaTag(q){
  if(!tendenciaQuente(q)) return '';
  return `<span class="tag tag-alerta" title="Essa questão apareceu em prova nos últimos anos com tendência de alta — atenção redobrada">⚠ alta recente</span>`;
}

// detecta questão inédita (gerada por IA, não pertence a nenhuma banca real) pelo
// prefixo "INÉDITA" no campo de banca — robusto a variações de vírgula/espaço,
// já que o prompt de geração pode formatar o texto de formas ligeiramente diferentes
function isInedita(q){
  // duas convenções em uso nas listas geradas até aqui: "INÉDITA, ..." e
  // "Elaboração própria — ...". Ambas indicam questão sintética, não de banca real.
  return !!(q.bc && /^\s*(inédita\b|elabora[çc][ãa]o pr[óo]pria\b)/i.test(q.bc));
}
function ineditaBadge(q){
  if(!isInedita(q)) return '';
  return `<span class="tag tag-inedita" title="Questão gerada por IA para completar o simulado — não é de banca real">🟥🟨 INÉDITA 🟨🟥</span>`;
}

// extrai referências legais citadas num texto (artigos, súmulas, leis), pra
// identificar quais são os "temas centrais" mais recorrentes de cada assunto —
// item 2 do dashboard analítico. Normaliza pequenas variações de escrita
// ("art." / "artigo", "nº" / "n°") pra não contar a mesma referência 2x.
function extrairReferenciasLegais(texto){
  if(!texto) return [];
  const refs = [];
  let m;
  const reArt = /\bart(?:igo)?\.?\s*(\d+)[ºo°]?/gi;
  while((m = reArt.exec(texto))) refs.push('Art. ' + m[1]);
  const reSumula = /\bs[uú]mula\s*n?[ºo°]?\.?\s*(\d+)/gi;
  while((m = reSumula.exec(texto))) refs.push('Súmula ' + m[1]);
  const reLei = /\blei\s+(?:complementar\s+)?n[ºo°]?\.?\s*([\d./]+)/gi;
  while((m = reLei.exec(texto))) refs.push('Lei ' + m[1]);
  return refs;
}

// analisa todos os assuntos de uma matéria: pra cada um, levanta as referências
// legais mais citadas (item 2) e calcula um índice de "probabilidade de
// cobrança" combinando % de questões de alta incidência com % de questões em
// tendência de alta recente (item 3) — quanto maior, mais provável de cair de
// novo em provas futuras, segundo o histórico já registrado nessa matéria
// identifica se a questão veio de uma banca/prova real (tem q.bc com banca
// reconhecível) ou é uma questão inédita (sem banca real, "—" de fallback) —
// item 1: a análise por assunto do dashboard só deve considerar questões reais
function ehQuestaoDeBancaReal(q){
  if(isInedita(q)) return false;
  const b = bancaCurta(q.bc);
  return !!b && b !== '—';
}
// CORREÇÃO (v54): o cálculo antigo tratava altaCount/quenteCount por QUESTÃO,
// usando q.nv/q.td — campos preenchidos a partir da "📊 Incidência histórica"
// que o Gemini fabrica POR QUESTÃO no momento da geração (sem contar exames
// de verdade, é só um palpite do texto). Isso mistura duas coisas diferentes:
// "quantas questões dessa matéria eu tenho na minha base" (tamanho da minha
// coleção) com "quão comum é esse assunto nas provas reais" (o que a pessoa
// de fato quer saber). Um assunto clássico e onipresente (ex.: Interpretação
// de Textos) pode ter só 1-2 questões na base agora e ainda assim aparecer
// como "assunto novo, alta probabilidade" — exatamente o bug relatado.
//
// A métrica nova conta PROVAS REAIS DISTINTAS (cada valor único de q.bc —
// banca+cargo+ano — é 1 prova), não questões. "Score" = % de provas da minha
// base que cobraram esse assunto, ponderando mais o comportamento recente
// (últimos 5 anos) do que o histórico total, porque bancas mudam ênfase.
// Sample size pequeno (poucas provas na base) reduz a CONFIANÇA da
// estimativa, mas nunca é convertido em "score forçado alto" como antes —
// preferimos avisar "poucos dados" a inventar um veredito.
function contarProvasDistintas(qs){
  const set = new Set();
  qs.forEach(q => { if(q.bc) set.add(q.bc); });
  return set;
}
// cache simples por matéria — narrativaBanca/probabilidadeCalculada chamam
// isso por QUESTÃO renderizada, e recalcular analisarTemasDaMateria (que
// percorre a base toda) a cada card seria caro. Invalidação: comparamos o
// tamanho atual de ALL_QUESTIONS com o tamanho no momento do cache; qualquer
// import/remoção/reprocessamento muda esse número quase sempre. Não é 100%
// à prova de um replace que mantenha exatamente a mesma contagem, mas esse
// caso é raro e o próximo import/edição já corrige.
let _analiseTemasCache = {};
function analisarTemasDaMateriaCached(materiaKey){
  const qtdAtual = ALL_QUESTIONS.length;
  const hit = _analiseTemasCache[materiaKey||''];
  if(hit && hit.qtdAtual===qtdAtual) return hit.dados;
  const dados = analisarTemasDaMateria(materiaKey);
  _analiseTemasCache[materiaKey||''] = { qtdAtual, dados };
  return dados;
}
function analisarTemasDaMateria(materiaKey){
  const todasQs = ALL_QUESTIONS.filter(q => q.materia===materiaKey && !q.duplicataOculta && (q.t==='CE'||q.t==='MC') && ehQuestaoDeBancaReal(q));
  const provasTotais = contarProvasDistintas(todasQs);
  const totalProvas = provasTotais.size;
  if(totalProvas===0) return [];

  const anoRef = anoMaisRecente(materiaKey);
  const JANELA_RECENTE_ANOS = 5;
  const provasRecentesSet = new Set(
    [...todasQs].filter(q => q.ar && anoRef && q.ar >= anoRef-(JANELA_RECENTE_ANOS-1)).map(q=>q.bc).filter(Boolean)
  );
  const totalProvasRecentes = provasRecentesSet.size;

  const temas = temasDisponiveis(materiaKey).filter(t => t && t!=='Fora do Edital');
  return temas.map(tema=>{
    const qs = todasQs.filter(q => q.tema===tema);
    if(qs.length===0) return null;

    const refsMap = {};
    qs.forEach(q=>{
      // dedup por questão: se o mesmo artigo aparece no enunciado E na resolução
      // da mesma questão, conta como 1 só — o que importa é quantas QUESTÕES
      // diferentes citam aquela referência, não quantas vezes ela é mencionada
      const refsUnicas = new Set(extrairReferenciasLegais((q.q||'') + ' ' + (q.r||'')));
      refsUnicas.forEach(ref=>{ refsMap[ref] = (refsMap[ref]||0) + 1; });
    });
    const refsOrdenadas = Object.entries(refsMap).sort((a,b)=>b[1]-a[1]).slice(0,3);

    const provasComTema = contarProvasDistintas(qs);
    const nProvasComTema = provasComTema.size;
    const provasRecentesComTema = [...provasComTema].filter(bc => provasRecentesSet.has(bc)).length;

    const incidenciaGeral = nProvasComTema/totalProvas;
    const incidenciaRecente = totalProvasRecentes>0 ? (provasRecentesComTema/totalProvasRecentes) : incidenciaGeral;
    const score = incidenciaGeral*0.4 + incidenciaRecente*0.6;

    // confiança da estimativa = quantas provas distintas embasam o cálculo
    // nessa matéria (não é por-tema — é a base toda). Poucas provas na base
    // = qualquer percentual aqui é pouco confiável, seja ele alto ou baixo.
    const confianca = totalProvas>=15 ? 'alta' : (totalProvas>=5 ? 'media' : 'baixa');

    let faixa;
    if(score>=0.66) faixa='alta';
    else if(score>=0.33) faixa='media';
    else faixa='baixa';

    const delta = incidenciaRecente - incidenciaGeral;
    const tendenciaTxt = delta>0.15 ? '↑ Crescente' : (delta<-0.15 ? '↓ Decrescente' : '→ Estável');

    return {
      tema, total: qs.length, refsOrdenadas,
      nProvasComTema, totalProvas, provasRecentesComTema, totalProvasRecentes,
      incidenciaGeral, incidenciaRecente, score, faixa, confianca, tendenciaTxt,
    };
  }).filter(Boolean).sort((a,b)=>b.score-a.score || b.total-a.total);
}

// dashboard analítico por matéria: mapeia os temas centrais mais recorrentes de
// cada assunto (item 2) e destaca os de maior probabilidade de cobrança futura
// (item 3) — pensado pra aparecer logo abaixo de "Configurar simulado"
// nome, acertos, erros e percentual de CADA matéria (não só a selecionada) —
// pedido explícito do usuário, exibido na página principal (renderLanding)
// faixa de cor pastel pro percentual, conforme pedido: 90-100 verde claro,
// 70-89 amarelo claro, 0-69 vermelho claro; sem tentativas = neutro
function faixaCorPct(pct, respondidas){
  if(!respondidas) return { bg:'#f3f1ea', fg:'#7a7566', fgForte:'#7a7566' };
  if(pct>=100) return { bg:'#e3eefb', fg:'#1e5f9d', fgForte:'#134a80' };
  if(pct>=90) return { bg:'#e3f6e9', fg:'#1e7d43', fgForte:'#166534' };
  if(pct>=70) return { bg:'#fdf4d9', fg:'#8a6416', fgForte:'#7a5a10' };
  return { bg:'#fce6e4', fg:'#a3352c', fgForte:'#8f2a22' };
}
function renderEstatisticasPorMateria(){
  const materias = materiasDisponiveis();
  if(materias.length<2) return ''; // com 1 matéria só, isso duplicaria o card grande de cima
  const linhas = materias.map(m=>{
    const s = computeSnapshotMateria(m);
    const respondidas = s.ac + s.erradas;
    const q = STATE.quizzesEmAndamento[m];

    return { nome: m, acertos: s.ac, erros: s.erradas, pct: s.taxa, respondidas, total: s.totalPontuavel, ativa: m===STATE.materia, temSimuladoEmAndamento, ultimaRespostaTs: s.ultimaRespostaTs };
  }).sort((a,b)=> a.nome.localeCompare(b.nome,'pt-BR') || b.respondidas - a.respondidas || b.pct - a.pct);
  const estiloCelula = 'font-size:13px;font-weight:400;font-family:inherit;line-height:1.4;';
  const abaAtual = STATE.estatisticasAba || 'tabela';
  return `

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <h3 style="margin:0;">📈 Estatísticas por matéria</h3>

        <button class="tab-btn ${abaAtual==='tabela'?'active':''}" data-estatisticas-aba="tabela" style="padding:4px 10px;font-size:12px;">📋 Tabela</button>
        <button class="tab-btn ${abaAtual==='tendencias'?'active':''}" data-estatisticas-aba="tendencias" style="padding:4px 10px;font-size:12px;">📈 Tendências</button>
      </div>

  </div>
  `;
}

function renderTabelaEstatisticas(linhas, estiloCelula){
  return `

// paleta de cores distintas por matéria (pedido explícito: "cores diversas por
// matéria") — cíclica, cobre qualquer quantidade de matérias sem repetir cor
// entre vizinhas até passar de 12
const PALETA_CORES_MATERIA = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4338ca','#0d9488','#be123c'];

// gráfico único (pedido explícito): todas as matérias no eixo X, % de acerto
// no eixo Y, cada matéria com sua própria cor — diferente da grade de
// tendências abaixo, que mostra a evolução diária de CADA matéria separada
function renderGraficoComparativoMaterias(linhas){
  const comResposta = linhas.filter(l=>l.respondidas>0);
  if(comResposta.length<2){
    return `<div style="font-size:12px;color:var(--ink-soft);padding:10px 4px;">Responda questões em pelo menos 2 matérias pra ver a comparação aqui.</div>`;
  }
  const largura = Math.max(360, comResposta.length*70);
  const altura = 220, margemEsq = 34, margemDir = 14, margemTopo = 14, margemBaixo = 64;
  const areaW = largura-margemEsq-margemDir, areaH = altura-margemTopo-margemBaixo;
  const coords = comResposta.map((l,i)=>{
    const x = margemEsq + (comResposta.length===1 ? areaW/2 : (i/(comResposta.length-1))*areaW);
    const y = margemTopo + (1 - l.pct/100)*areaH;
    const cor = PALETA_CORES_MATERIA[i % PALETA_CORES_MATERIA.length];
    return { x, y, l, cor };
  });
  const linhaPontos = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const gradeY = [0,25,50,75,100].map(v=>{
    const y = margemTopo + (1-v/100)*areaH;
    return `<line x1="${margemEsq}" y1="${y.toFixed(1)}" x2="${largura-margemDir}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".08" />
      <text x="${margemEsq-6}" y="${y.toFixed(1)}" font-size="10" text-anchor="end" dominant-baseline="middle" fill="currentColor" opacity=".55">${v}%</text>`;
  }).join('');
  const marcadores = coords.map(c=>`
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="${c.cor}" stroke="var(--paper,#fdfaf2)" stroke-width="1.5">
      <title>${esc(c.l.nome)}: ${c.l.pct}% (${c.l.respondidas} resposta${c.l.respondidas>1?'s':''})</title>
    </circle>
    <text x="${c.x.toFixed(1)}" y="${(c.y-9).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="${c.cor}">${c.l.pct}%</text>
    <text x="${c.x.toFixed(1)}" y="${(margemTopo+areaH+16).toFixed(1)}" font-size="10" text-anchor="end" fill="currentColor" opacity=".75" transform="rotate(-40 ${c.x.toFixed(1)} ${(margemTopo+areaH+16).toFixed(1)})">${esc(c.l.nome.length>18 ? c.l.nome.slice(0,17)+'…' : c.l.nome)}<title>${esc(c.l.nome)}</title></text>
  `).join('');
  return `<div style="overflow-x:auto;">
    <svg viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}" style="display:block;min-width:${largura}px;">
      ${gradeY}
      <polyline points="${linhaPontos}" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      ${marcadores}
    </svg>
  </div>`;
}
