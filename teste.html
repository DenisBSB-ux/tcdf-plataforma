<script>
const FONTES_OFICIAIS = {
  "pdpm": { titulo: "PDPM Mulheres", normas: ["II Plano Distrital de Políticas para Mulheres (PDPM)", "Decreto Distrital nº 42.590/2021"], orgaos: ["Secretaria da Mulher DF", "DODF"] },
  "primeiros": { titulo: "Primeiros Socorros", normas: ["Diretrizes Internacionais AHA (Suporte Básico de Vida)", "Protocolos CBMDF"], orgaos: ["Corpo de Bombeiros Militar do DF", "Ministério da Saúde"] },
  "44330": { titulo: "Decreto Distrital nº 44.330/2023", normas: ["Decreto Distrital nº 44.330/23 (Regulamento de Licitações do DF)", "Lei Federal 14.133/21"], orgaos: ["Governo do DF", "PNCP"] },
  "840": { titulo: "RJU - LC nº 840/2011", normas: ["Lei Complementar Distrital nº 840/2011 e alterações"], orgaos: ["Tribunal de Contas do DF", "CLDF"] },
  "lotcdf": { titulo: "Lei Orgânica do TCDF", normas: ["LC Distrital nº 1/1994 (LOTCDF)"], orgaos: ["TCDF (tc.df.gov.br)"] },
  "lodf": { titulo: "LODF - Lei Orgânica do DF", normas: ["Lei Orgânica do Distrito Federal atualizada"], orgaos: ["CLDF (cl.df.gov.br)"] },
  "reg_interno": { titulo: "Regimento Interno do TCDF", normas: ["Resolução TCDF nº 296/2016"], orgaos: ["Plenário do TCDF"] },
  "afo": { titulo: "AFO - Orçamento Público", normas: ["LRF (LC 101/00)", "Lei 4.320/64", "CF/88"], orgaos: ["Portal do Planalto", "STN"] },
  "padrao": { titulo: "Legislação do Concurso TCDF", normas: ["Constituição Federal de 1988", "Normas vigentes"], orgaos: ["Planalto.gov.br", "DODF", "STF"] }
};

window.abrirModalFontes = function(chave) {
  const antigo = document.getElementById("modal-fontes-popup");
  if (antigo) antigo.remove();
  const d = FONTES_OFICIAIS[chave] || FONTES_OFICIAIS["padrao"];
  const modal = document.createElement("div");
  modal.id = "modal-fontes-popup";
  modal.style = "position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:999999;backdrop-filter:blur(5px);";
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div style="background:#1e293b;border:1px solid #334155;border-radius:14px;width:90%;max-width:500px;padding:24px;color:#f8fafc;box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);font-family:system-ui,sans-serif;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding-bottom:10px;margin-bottom:14px;">
        <h3 style="color:#fbbf24;margin:0;font-size:16px;">🏛️ Auditoria Jurídica Oficial</h3>
        <button onclick="document.getElementById('modal-fontes-popup').remove()" style="background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;">&times;</button>
      </div>
      <p style="margin:0 0 10px 0;"><b>Matéria:</b> <span style="color:#38bdf8;">${d.titulo}</span></p>
      <div style="margin-bottom:12px;">
        <span style="font-size:11px;color:#94a3b8;text-transform:uppercase;font-weight:700;">Legislação Aplicada:</span>
        <ul style="margin:4px 0 0 18px;padding:0;font-size:13px;color:#cbd5e1;">${d.normas.map(n=>`<li>${n}</li>`).join("")}</ul>
      </div>
      <div style="margin-bottom:16px;">
        <span style="font-size:11px;color:#94a3b8;text-transform:uppercase;font-weight:700;">Portais Oficiais Verificados:</span>
        <ul style="margin:4px 0 0 18px;padding:0;font-size:13px;color:#cbd5e1;">${d.orgaos.map(o=>`<li>${o}</li>`).join("")}</ul>
      </div>
      <div style="text-align:right;">
        <button onclick="document.getElementById('modal-fontes-popup').remove()" style="background:#334155;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;cursor:pointer;">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
};
</script>
