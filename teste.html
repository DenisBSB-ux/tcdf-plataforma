window.abrirModalNorma = function(chave) {

      </div>

  document.body.appendChild(m);

// Estiliza o alerta de gabarito diretamente na resolução da questão
const obsQuestoes = new MutationObserver(() => {
  document.querySelectorAll(".resolucao-box, .resolucao, .comentario").forEach(box => {
    if(box.textContent.includes("🚨 [ATENÇÃO: GABARITO/LEGISLAÇÃO REVISADA") && !box.querySelector(".card-alerta-gabarito")) {
      const match = box.innerHTML.match(/🚨 \[ATENÇÃO: GABARITO\/LEGISLAÇÃO REVISADA EM (.*?)\]<br>Norma Atualizadora: (.*?)<br>Impacto Jurídico: (.*?)<br>Gabarito Vigente: (.*?)(?:<br>|$)/);
      if(match) {
        box.innerHTML = box.innerHTML.replace(/🚨 \[ATENÇÃO: GABARITO\/LEGISLAÇÃO REVISADA.*?Gabarito Vigente: .*?(?:<br>|$)/, "");
        const card = document.createElement("div");
        card.className = "card-alerta-gabarito";
        card.style = "background:rgba(239,68,68,0.1);border:1px solid #ef4444;border-left:4px solid #ef4444;border-radius:6px;padding:12px;margin-bottom:12px;color:#fca5a5;font-size:13px;";
        card.innerHTML = `
          <strong style="color:#f87171;display:block;margin-bottom:4px;font-size:14px;">🚨 Gabarito / Legislação Retificada (${match[1]})</strong>
          <div><b>Norma:</b> ${match[2]}</div>
          <div><b>Motivo da Mudança:</b> ${match[3]}</div>
          <div style="margin-top:6px;font-weight:700;color:#fff;background:#dc2626;display:inline-block;padding:2px 8px;border-radius:4px;">Gabarito Vigente: ${match[4]}</div>
        `;
        box.prepend(card);
      }
    }
  });
});
obsQuestoes.observe(document.body, { childList: true, subtree: true });
</script>
